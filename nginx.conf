events {
    worker_connections 1024;
}

http {
    upstream deadcode_api_servers {
        # 'deadcode_api' is the service name in docker-compose.
        # Docker's internal DNS will automatically resolve this to all 3 replicas.
        server deadcode_api:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://deadcode_api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
